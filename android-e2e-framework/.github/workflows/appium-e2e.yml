name: Appium Android E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  mobile-e2e:
    runs-on: macos-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Setup Java 11
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Install Appium
      run: |
        npm install -g appium
        appium driver install uiautomator2
        
    - name: Install Dependencies
      run: |
        cd android-e2e-framework
        npm install

    - name: Run Appium E2E Tests on Emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 29
        target: default
        arch: x86_64
        profile: pixel_4
        script: |
          appium --log-level error &
          sleep 10
          cd android-e2e-framework
          npm run test:auth
      env:
        APP_MODE: apk
        APK_PATH: ../build/app/outputs/flutter-apk/app-release.apk

    - name: Upload Test Reports (Excel & HTML)
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: e2e-reports
        path: |
          android-e2e-framework/excel/
          android-e2e-framework/reports/
          android-e2e-framework/logs/
          android-e2e-framework/screenshots/
