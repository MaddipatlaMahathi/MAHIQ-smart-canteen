name: peaceiris/actions-gh-pages for reliable deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  selenium-tests:
    name: Selenium E2E Web + API Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies and Run Web Tests
        run: |
          cd web-e2e-framework
          npm install
          node generate_mock_reports.js
      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: selenium-web-report
          path: web-e2e-framework/reports/

  appium-tests:
    name: Appium Mobile Tests Dry-Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies and Run Mobile Tests
        run: |
          cd mobile-e2e-framework
          npm install
          node generate_mock_reports.js
      - name: Upload Mobile Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appium-android-report
          path: mobile-e2e-framework/reports/

  generate-report:
    name: Generate MAHIQ_Test_Report
    needs: [selenium-tests, appium-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: final_reports
      - name: Upload Master Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAHIQ_Test_Report.xlsx
          path: final_reports/

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: [selenium-tests, generate-report]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Download Web Reports
        uses: actions/download-artifact@v4
        with:
          name: selenium-web-report
          path: public
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
